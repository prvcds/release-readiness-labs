apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-app
  labels:
    app: orderflow-app
    version: v2.3.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orderflow-app
  template:
    metadata:
      labels:
        app: orderflow-app
        version: v2.3.0
    spec:
      containers:
      - name: orderflow-app
        image: orderflow:v2.3.0
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: API_KEY
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: DATABASE_PASSWORD

